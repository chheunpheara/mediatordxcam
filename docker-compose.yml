# CamDX KYC — local development stack.
#
#   docker compose up --build              # frontend (:3000) + API (:8000) + PostgreSQL
#   docker compose down -v                 # stop; -v also wipes the data volumes
#
# Two containers, two ports, one origin for the browser:
#
#   browser ──► frontend (:3000, nginx) ── serves the SPA
#                    │  /api, /health, /docs proxied
#                    ▼
#               app (:8000, FastAPI) ── API only, no static files
#                    │
#                    ▼
#               postgres (:5432) ── sample identity registry (D13)
#
# The browser only ever addresses :3000; nginx keeps API traffic on the same
# origin, so no CORS configuration is needed for the product itself (§30).
#
# PostgreSQL is part of the default stack (D13): verification compares the
# submitted identity against stored sample records, which makes the database a
# dependency of the product rather than an optional profile. The app waits for
# it to become healthy and gets an in-network DSN below — the `DATABASE_URL` in
# `.env` only affects running the backend on the host, never this container.
#
# Secrets are never baked into an image. CAMDX_* come from the host environment or
# from a local `.env`, which is git-ignored (§22). Only the `app` service receives
# them — the frontend container holds no credentials at all.

name: camdx-kyc

services:
  app:
    build:
      # API-only image. The SPA is built and served by the `frontend` service, so
      # nothing in this container is served from a static directory (§29).
      context: ./backend
      dockerfile: Dockerfile
    image: camdx-kyc-backend:local
    ports:
      - "8000:8000"
    environment:
      # Every Settings field must appear here. Compose only forwards variables
      # listed in this block — anything present in `.env` but absent here is
      # silently dropped, so a setting can look configured and do nothing.
      # tests/integration/test_compose_env_contract.py fails if they drift.
      #
      # APP_ENV is pinned, not overridable: it describes the runtime, and this is
      # a container. Letting `.env` set it to `local` would enable internal
      # detail in error envelopes inside Docker (§28).
      APP_ENV: docker
      APP_NAME: ${APP_NAME:-camdx-kyc-backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Hard-off in the container. Payload logging needs an explicit opt-in that a
      # compose file should never provide (§29).
      LOG_SENSITIVE_PAYLOADS: "false"

      CAMDX_MODE: ${CAMDX_MODE:-mock}
      CAMDX_BASE_URL: ${CAMDX_BASE_URL:-}
      CAMDX_CLIENT_ID: ${CAMDX_CLIENT_ID:-}
      CAMDX_CLIENT_SECRET: ${CAMDX_CLIENT_SECRET:-}
      CAMDX_API_KEY: ${CAMDX_API_KEY:-}
      CAMDX_TIMEOUT: ${CAMDX_TIMEOUT:-30}
      CAMDX_EXPOSE_DEVELOPER_VIEW: ${CAMDX_EXPOSE_DEVELOPER_VIEW:-false}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+khm}
      # Local NLP for field extraction. host.docker.internal reaches the host's Ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}

      # Sign-in and per-method permissions (D18). Defaults on; never disable
      # this for a shared stack. The seeded default admin is documented in
      # .env.example — change it after first login.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MIN_IMAGE_WIDTH: ${MIN_IMAGE_WIDTH:-640}
      MIN_IMAGE_HEIGHT: ${MIN_IMAGE_HEIGHT:-480}

      # Fixed to the volume mount path; a host override here would point the
      # store somewhere the container cannot write, and biometric storage must
      # stay off any served path in any case (§29).
      TEMP_STORAGE_DIR: /app/var/tmp
      TEMP_ARTIFACT_TTL_SECONDS: ${TEMP_ARTIFACT_TTL_SECONDS:-900}
      TEMP_SWEEP_INTERVAL_SECONDS: ${TEMP_SWEEP_INTERVAL_SECONDS:-60}

      # The in-network DSN, assembled from the same POSTGRES_* the `postgres`
      # service receives, so credentials cannot drift between the two. It is a
      # fixed value rather than ${DATABASE_URL:-…} on purpose: the host's
      # DATABASE_URL points at localhost, which inside this container is the
      # container itself — forwarding it would break the only value that works.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-camdx}:${POSTGRES_PASSWORD:-camdx_local_only}@postgres:5432/${POSTGRES_DB:-camdx_kyc}
    depends_on:
      postgres:
        # Verification queries the registry during the first request; starting
        # the app before Postgres accepts connections would fail startup (D13).
        condition: service_healthy
    volumes:
      # Named volume for biometric temp storage: no bytes in an image layer, and
      # `docker compose down -v` wipes them (§29).
      - app-tmp:/app/var/tmp
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not `localhost`: curl can resolve `localhost` to ::1 first,
      # while the app binds IPv4 only.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    # The browser-facing container: builds the SPA and serves it, proxying API
    # traffic back to `app` so the product stays single-origin from the browser's
    # point of view (§30).
    #
    # It receives no `environment:` block on purpose. Credentials are backend
    # configuration; a container whose only job is serving static files must not
    # hold any of them, and `tests/integration/test_compose_env_contract.py`
    # asserts that stays true.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: camdx-kyc-frontend:local
    ports:
      - "3000:80"
    depends_on:
      # nginx resolves `upstream backend` at startup, so the API container must
      # exist first — and healthy, or nginx would happily proxy to a process that
      # has not finished booting.
      app:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck comes from frontend/Dockerfile (nginx /healthz).

  postgres:
    # The sample identity registry (D13). Started with the default stack —
    # `docker compose up` brings it up alongside app and frontend.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camdx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camdx_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-camdx_kyc}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-camdx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-tmp:
  postgres-data: