# Default-stack frontend configuration.
#
# This is the browser-facing origin of the product: nginx serves the built SPA
# on :80 and proxies API and WebSocket traffic to the `app` container, so the
# browser only ever addresses one host (§30). docker-compose.yml publishes it
# on :3000.
#
# `upstream backend` names the compose service. For a non-Compose deployment,
# point it at the API host — and keep it that way: the browser must only ever
# address this origin, never CamDigiKey (§30).

upstream backend {
    server app:8000;
    keepalive 16;
}

# `Connection: upgrade` only when the client actually asked to upgrade; the
# reverse proxy must otherwise send `close`, or keepalive proxies stick.
# This file is included from the stock `http` context, so a map belongs here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths must return the SPA shell, not a 404.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # The teller screen and the customer display relay through a WebSocket
    # (Phase 7). A handshake answered by the SPA fallback below comes back as
    # HTML, the socket never opens, and the teller sits on "Waiting for the
    # customer's webcam frames…" forever — so the relay gets its own location.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # The relay outlives any request/response cycle: one verification can
        # run for minutes, and a default 60s read timeout would drop it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # JPEG frames must reach the other tab as they arrive.
        proxy_buffering off;
    }

    # API traffic is proxied, never resolved from the browser, so the API's
    # credential-bearing requests and this origin stay on one host (§30).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve our correlation id so an error report can be traced (§28).
        proxy_set_header X-Request-Id $request_id;

        # Verification requests can involve a slow upstream. Do not cut them off
        # early; the backend's own CAMDX_TIMEOUT is the real bound.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Biometric responses must never be cached by an intermediary.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # API docs are part of the product surface (README: http://localhost:8000/docs
    # stays valid too) — proxy them rather than letting the SPA fallback below
    # return HTML where a developer expects Swagger UI. `/openapi.json` is what
    # that UI fetches, so both are needed.
    location = /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Health probes are forwarded, not swallowed by the SPA fallback above.
    # Orchestrators hit `/health` to decide whether to restart the container, so
    # an HTML response here would read as healthy-but-wrong and hide failures.
    location = /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://backend/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}