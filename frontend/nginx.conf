# Split-deployment frontend configuration.
#
# NOT used by the default stack. There is no `frontend` service in
# docker-compose.yml: the `app` image builds and serves the SPA itself, so the
# product is single-origin on :8000. See docs/development.md §8 before using this.
#
# Untested by CI. If you deploy split, verify deep links, the /api proxy and the
# health probes end to end first.
#
# `upstream backend` names the compose service. For a non-Compose deployment,
# point it at the API host — and keep it that way: the browser must only ever
# address this origin, never CamDigiKey (§30).

upstream backend {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths must return the SPA shell, not a 404.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # API traffic is proxied, never resolved from the browser, so the API's
    # credential-bearing requests and this origin stay on one host (§30).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve our correlation id so an error report can be traced (§28).
        proxy_set_header X-Request-Id $request_id;

        # Verification requests can involve a slow upstream. Do not cut them off
        # early; the backend's own CAMDX_TIMEOUT is the real bound.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Biometric responses must never be cached by an intermediary.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Health probes are forwarded, not swallowed by the SPA fallback above.
    # Orchestrators hit `/health` to decide whether to restart the container, so
    # an HTML response here would read as healthy-but-wrong and hide failures.
    location = /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://backend/health/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}