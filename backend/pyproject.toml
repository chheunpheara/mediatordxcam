[project]
name = "camdx-kyc-backend"
version = "0.1.0"
description = "CamDX KYC verification application backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
# Compose contract tests read docker-compose.yml; runtime does not need this.
compose = ["pyyaml>=6.0,<7.0"]
# Phase 3 — local face detection (§12, §13)
vision = ["opencv-python-headless>=4.10,<6.0", "numpy>=1.26,<3.0"]
# Phase 10 — persistence, only if a phase requires it (§4, D7)
db = ["sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.14,<2.0"]
dev = [
    "pyyaml>=6.0,<7.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit — security rules matter here (§29, §30)
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and in assertions of our own invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["^var/"]

[[tool.mypy.overrides]]
module = ["tests.*", "app.main"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]