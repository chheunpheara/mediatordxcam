[project]
name = "camdx-kyc-backend"
version = "0.1.0"
description = "CamDX KYC verification application backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
]

[project.optional-dependencies]
# Compose contract tests read docker-compose.yml; runtime does not need this.
compose = ["pyyaml>=6.0,<7.0"]
# Phase 3 — local face detection (§12, §13)
# Upper bound is 5.0, not 6.0: OpenCV 5 removed `CascadeClassifier` and no longer
# bundles Haar cascades in the headless wheel. Face detection (§12) relies on
# `haarcascade_frontalface_default.xml` from the installed package, so 5.x would
# resolve successfully and then silently detect nothing — the worst kind of
# dependency failure. Revisit when a DNN detector is adopted deliberately.
vision = [
    "opencv-python-headless>=4.10,<5.0",
    "numpy>=1.26,<3.0",
    "pytesseract>=0.3.13,<0.4",
    "Pillow>=10,<13",
]
# Identity registry (D13) — the sample records verification compares against.
# `psycopg` is what a live PostgreSQL needs: the Docker image and a host run
# against the compose database. No Alembic on purpose — one table created at
# startup has no migration history worth a framework (see infrastructure/db.py).
db = ["sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0"]
dev = [
    # Self-references: the suite exercises the whole app, so a dev install must
    # import like one — face and OCR modules need `vision` (cv2, tesseract),
    # and the app imports SQLAlchemy unconditionally since the identity
    # registry (D13) arrived, without which the tests cannot even collect.
    "camdx-kyc-backend[db,vision]",
    "pyyaml>=6.0,<7.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit — security rules matter here (§29, §30)
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and in assertions of our own invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Matches the deployed runtime (`python:3.12-slim`). numpy 2.x ships stubs using
# 3.12+ syntax, so type-checking against a lower target fails to parse them.
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["^var/"]

[[tool.mypy.overrides]]
module = ["tests.*", "app.main"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]